scan_now:
  name: "Custom Component Monitor: manual scan"
  description: Trigger an immediate scan of all HACS-installed custom components.

update_and_action:
  name: "Update and Add Action"
  description: >-
    Install the HACS update and add a to-do item to track follow-up actions.
    The to-do item will include the release notes from the update.
  fields:
    entity_id:
      name: "Update Entity"
      description: The update entity to install (e.g. update.my_integration_update).
      required: true
      selector:
        entity:
          domain: update
    version:
      name: "Version"
      description: Specific version to install. If omitted, installs the latest version.
      selector:
        text:

update_all:
  name: "Update all"
  description: >-
    Install every available HACS custom-component update at once (integrations,
    cards and themes that currently show an update).
  fields:
    create_actions:
      name: "Create action items"
      description: >-
        Also add a to-do item for each component (with release notes), the same
        as "Update & Action". Off by default — just installs.
      default: false
      selector:
        boolean:
    entity_ids:
      name: "Limit to entities"
      description: >-
        Only update these update entities. If omitted, every pending HACS update
        is installed. The card's "Update selected" passes the currently-filtered
        set here.
      selector:
        entity:
          domain: update
          multiple: true

generate_summaries:
  name: "Generate AI summaries"
  description: >-
    Generate the missing AI summaries and categories for pending HACS updates.
    Only updates that don't already have a summary are sent to the AI, unless
    "Force" is enabled. Requires AI summaries to be enabled in the integration
    options.
  fields:
    entity_ids:
      name: "Limit to entities"
      description: >-
        Only summarise these update entities. If omitted, every pending update
        that is missing a summary is processed. The card's "Generate summaries"
        button passes the currently-shown set here.
      selector:
        entity:
          domain: update
          multiple: true
    force:
      name: "Force"
      description: >-
        Regenerate even when a summary already exists, and ignore the retry
        backoff after previous failures. Costs one AI call per update.
      default: false
      selector:
        boolean:
    max_items:
      name: "Maximum updates"
      description: Stop after this many AI calls. Omit for no limit.
      selector:
        number:
          min: 1
          max: 100
          mode: box

dismiss_new_items:
  name: "Dismiss new HACS items"
  description: >-
    Dismiss one or more items from the "New in HACS" review card. Give
    exactly one of repositories, category or all — it acts on whatever
    sensor.hacs_new_items is currently showing as new.
  fields:
    repositories:
      name: "Repositories"
      description: >-
        Dismiss these repositories (owner/repo, e.g.
        "home-assistant/core"). Only ones currently shown as new are
        affected — anything else is ignored.
      selector:
        text:
          multiple: true
    category:
      name: "Category"
      description: Dismiss every currently-shown new item in this category.
      selector:
        select:
          options:
            - "Appliances"
            - "Climate & heating"
            - "Dashboard & theming"
            - "Energy & solar"
            - "Health & fitness"
            - "Lighting"
            - "Media & audio"
            - "Network & infrastructure"
            - "Notifications & voice"
            - "Presence & location"
            - "Security & cameras"
            - "Tasks & calendar"
            - "Transport & travel"
            - "Vehicles & EV"
            - "Weather & environment"
            - "Other"
    all:
      name: "All"
      description: Dismiss every currently-shown new item.
      selector:
        boolean:

restore_new_items:
  name: "Restore new HACS items"
  description: >-
    Bring back items previously dismissed or auto-hidden on the "New in
    HACS" review card. Give exactly one of repositories, category or all.
    An item restored from auto-hide is also marked "never hide again", so
    the country rule can't immediately hide it a second time.
  fields:
    repositories:
      name: "Repositories"
      description: >-
        Restore these repositories (owner/repo). One that isn't currently
        dismissed or hidden is ignored.
      selector:
        text:
          multiple: true
    category:
      name: "Category"
      description: Restore every hidden or dismissed item in this category.
      selector:
        select:
          options:
            - "Appliances"
            - "Climate & heating"
            - "Dashboard & theming"
            - "Energy & solar"
            - "Health & fitness"
            - "Lighting"
            - "Media & audio"
            - "Network & infrastructure"
            - "Notifications & voice"
            - "Presence & location"
            - "Security & cameras"
            - "Tasks & calendar"
            - "Transport & travel"
            - "Vehicles & EV"
            - "Weather & environment"
            - "Other"
    all:
      name: "All"
      description: Restore every hidden and dismissed item.
      selector:
        boolean:

categorise_new_items:
  name: "Categorise new HACS items"
  description: >-
    Run AI categorisation for pending items on the "New in HACS" review
    card. You should not normally need this: sorting starts by itself after
    every scan and keeps going until the backlog is clear. Only items
    without a cached category are processed unless "Force" is enabled.
    Requires AI summaries to be enabled in the integration options.
  fields:
    max_items:
      name: "Maximum items"
      description: >-
        Sort at most this many items and then stop for good — no background
        catch-up afterwards. Omit to sort the whole backlog.
      selector:
        number:
          min: 1
          max: 2000
          mode: box
    max_seconds:
      name: "Time limit"
      description: >-
        How long this one pass may spend on AI calls before handing the rest
        to the background catch-up. Omit to use the "AI sorting time per
        pass" option.
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
          mode: box
    force:
      name: "Force"
      description: >-
        Re-categorise even items that already have a cached AI category,
        ignoring the cache. Costs one AI call per item.
      default: false
      selector:
        boolean:

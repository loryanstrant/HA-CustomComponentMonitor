</style><main><h1>Preview: themes and templates in your existing card</h1><p class="note">Sample items · no changes to Home Assistant</p><hacs-new-items-card></hacs-new-items-card></main><script src="card.js"></script><script>
customElements.define('ha-icon',class extends HTMLElement {connectedCallback(){this.textContent=({'mdi:download':'↓','mdi:close':'×','mdi:chevron-down':'⌄','mdi:check':'✓'})[this.getAttribute('icon')]||'';}});
const item=(name,kind,category,description,stars=120)=>({name,kind,category,description,stars,age_days:1,full_name:'sample/'+name.toLowerCase().replaceAll(' ','-'),repository:'https://github.com/sample/'+name.toLowerCase().replaceAll(' ','-')});
